<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Vote Omar Kheriji | Engineering Faculty Rep</title>
  <style>
    :root {
      --bg: #f8f7f4;
      --bowl-border: #d4cfc5;
      --bowl-fill: #ffffff;
      --text: #2f2e2c;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      color: var(--text);
    }

    header {
      text-align: center;
      margin-bottom: 2rem;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    header h1 {
      font-size: 1.25rem;
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    header p {
      font-size: 0.9rem;
      color: #7a7672;
      margin-top: 4px;
    }

    /* Minimalist Bowl Container */
    .bowl-wrapper {
      position: relative;
      width: 320px;
      height: 320px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .bowl {
      position: absolute;
      width: 290px;
      height: 290px;
      border-radius: 50%;
      background: var(--bowl-fill);
      border: 3px solid var(--bowl-border);
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.04), inset 0 2px 10px rgba(0, 0, 0, 0.03);
    }

    .tomatoes-area {
      position: absolute;
      width: 250px;
      height: 250px;
      border-radius: 50%;
      overflow: visible;
    }

    /* Simplistic Tomato Style */
    .tomato {
      position: absolute;
      width: 44px;
      height: 44px;
      background: #e74c3c;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: inset -3px -3px 0 rgba(0, 0, 0, 0.08), 0 3px 6px rgba(0, 0, 0, 0.08);
      transition: transform 0.12s ease-out;
      -webkit-tap-highlight-color: transparent;
    }

    .tomato:active {
      transform: scale(0.92);
    }

    /* Calyx / Leaf Top */
    .tomato::before {
      content: "";
      position: absolute;
      top: -3px;
      width: 10px;
      height: 10px;
      background: #27ae60;
      clip-path: polygon(50% 0%, 80% 40%, 100% 100%, 50% 70%, 0% 100%, 20% 40%);
    }

    /* Pop Animation */
    .popped {
      animation: popBurst 0.22s forwards ease-out;
      pointer-events: none;
    }

    @keyframes popBurst {
      0% {
        transform: scale(1);
        opacity: 1;
      }
      60% {
        transform: scale(1.4);
        opacity: 0.8;
      }
      100% {
        transform: scale(0);
        opacity: 0;
      }
    }

    /* Splash particle on pop */
    .particle {
      position: absolute;
      width: 6px;
      height: 6px;
      background: #e74c3c;
      border-radius: 50%;
      pointer-events: none;
      animation: scatter 0.3s forwards ease-out;
    }

    @keyframes scatter {
      0% {
        transform: translate(0, 0) scale(1);
        opacity: 1;
      }
      100% {
        transform: translate(var(--dx), var(--dy)) scale(0);
        opacity: 0;
      }
    }
  </style>
</head>
<body>

  <header id="header">
    <h1>Engineering Faculty Rep</h1>
    <p id="subtext">Tap a tomato to pop it</p>
  </header>

  <div class="bowl-wrapper">
    <div class="bowl"></div>
    <div class="tomatoes-area" id="tomatoContainer"></div>
  </div>

  <!-- Audio asset (placed in repo root as pop.mp3) -->
  <audio id="popAudio" src="pop.mp3" preload="auto"></audio>

  <script>
    const container = document.getElementById('tomatoContainer');
    const popAudio = document.getElementById('popAudio');
    const subtext = document.getElementById('subtext');
    const redirectUrl = "https://www.instagram.com/omar_kheriji_engineering_rep/";

    const count = Math.floor(Math.random() * (30 - 10 + 1)) + 10;
    let remaining = count;
    const radius = 100;
    const center = 125;

    function playPopSound() {
      if (popAudio) {
        // Clone or clone-play allows overlapping rapid taps without audio clipping
        const sound = popAudio.cloneNode();
        // Subtle random pitch variation between 0.9x and 1.15x
        sound.playbackRate = 0.9 + Math.random() * 0.25;
        sound.play().catch(() => {});
      }
    }

    function triggerHaptic() {
      if ('vibrate' in navigator) {
        navigator.vibrate(35);
      }
    }

    function createParticles(x, y) {
      for (let i = 0; i < 6; i++) {
        const particle = document.createElement('div');
        particle.className = 'particle';
        particle.style.left = `${x + 19}px`;
        particle.style.top = `${y + 19}px`;

        const angle = (Math.PI * 2 * i) / 6;
        const dist = 20 + Math.random() * 20;
        particle.style.setProperty('--dx', `${Math.cos(angle) * dist}px`);
        particle.style.setProperty('--dy', `${Math.sin(angle) * dist}px`);

        container.appendChild(particle);
        setTimeout(() => particle.remove(), 300);
      }
    }

    for (let i = 0; i < count; i++) {
      const tomato = document.createElement('div');
      tomato.className = 'tomato';

      const r = Math.sqrt(Math.random()) * radius;
      const theta = Math.random() * 2 * Math.PI;
      const posX = center + r * Math.cos(theta) - 22;
      const posY = center + r * Math.sin(theta) - 22;

      tomato.style.left = `${posX}px`;
      tomato.style.top = `${posY}px`;

      tomato.addEventListener('pointerdown', () => {
        triggerHaptic();
        playPopSound();
        createParticles(posX, posY);
        tomato.classList.add('popped');
        setTimeout(() => tomato.remove(), 250);

        remaining--;

        if (remaining === 0) {
          subtext.textContent = "Redirecting...";
          setTimeout(() => {
            window.location.href = redirectUrl;
          }, 450);
        }
      });

      container.appendChild(tomato);
    }
  </script>
</body>
</html>
